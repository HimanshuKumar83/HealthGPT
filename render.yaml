databases:
  - name: zentra-db
    databaseName: zentra
    user: zentra_user
    plan: free

services:
  - type: redis
    name: zentra-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: zentra-backend
    env: python
    plan: free
    rootDir: zentra-backend
    buildCommand: pip install -r requirements.txt && python app/rag/embed_data.py
    startCommand: python download_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      
      - key: DATABASE_URL
        fromDatabase:
          name: zentra-db
          property: connectionString
      
      - key: REDIS_URL
        fromService:
          name: zentra-redis
          type: redis
          property: connectionString
      
      - key: REDIS_HOST
        fromService:
          name: zentra-redis
          type: redis
          property: host
      
      - key: REDIS_PORT
        fromService:
          name: zentra-redis
          type: redis
          property: port
      
      - key: REDIS_PASSWORD
        fromService:
          name: zentra-redis
          type: redis
          property: password
      
      - key: SECRET_KEY
        generateValue: true
      
      - key: ALGORITHM
        value: HS256
      
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "600"
      
      # Email settings - Set manually in Render dashboard if needed
      - key: MAIL_USERNAME
        sync: false
      
      - key: MAIL_PASSWORD
        sync: false
      
      - key: MAIL_FROM
        sync: false
      
      - key: MAIL_PORT
        value: "587"
      
      - key: MAIL_SERVER
        value: smtp.gmail.com
      
      - key: MAIL_FROM_NAME
        value: HealthGPT
      
      - key: MAIL_STARTTLS
        value: "True"
      
      - key: MAIL_SSL_TLS
        value: "False"
      
      - key: USE_CREDENTIALS
        value: "True"
      
      - key: VALIDATE_CERTS
        value: "True"
      
      # API Keys - YOU MUST UPDATE THESE IN RENDER DASHBOARD
      - key: GEMINI_API_KEY
        sync: false
      
      # Frontend URL - Set to your Vercel URL
      - key: FRONTEND_URL
        sync: false
      
      # Embedding configuration (google or huggingface)
      - key: EMBEDDING_TYPE
        value: google
      
      # Optional: set to true to download pre-built HuggingFace DB instead of embedding during build
      - key: SKIP_BUILD_EMBED
        value: "false"
      
      # Optional: URL to download pre-built HuggingFace DB (if SKIP_BUILD_EMBED is true)
      - key: CHROMA_DOWNLOAD_URL
        sync: false
