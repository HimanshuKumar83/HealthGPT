databases:
  - name: zentra-db
    databaseName: zentra
    user: zentra_user
    plan: free

services:
  # ─── FastAPI Backend Service ───────────────────────────────────────────────
  - type: web
    name: zentra-backend
    env: python
    plan: free
    rootDir: zentra-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python download_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: zentra-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "600"

      # API Keys - Set your Google Gemini API key in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # Frontend URL for CORS (set to your frontend domain or leave blank for automatic regex matching)
      - key: FRONTEND_URL
        sync: false

      # Embedding configuration (google or huggingface)
      - key: EMBEDDING_TYPE
        value: google

      # Skip embedding 20k+ docs during build (prevents 15-minute build timeout)
      - key: SKIP_BUILD_EMBED
        value: "true"

      # Optional: direct download URL for pre-built Chroma DB (e.g. from GitHub Release or Cloud Storage)
      - key: CHROMA_DOWNLOAD_URL
        sync: false

  # ─── React + Vite Frontend (Static Site) ────────────────────────────────────
  - type: web
    name: zentra-frontend
    env: static
    plan: free
    rootDir: zentra-ui
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: zentra-backend
          property: host
