databases:
  - name: zentra-db
    databaseName: zentra
    user: zentra_user
    plan: free

services:
  - type: web
    name: zentra-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python download_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: zentra-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "600"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: FRONTEND_URL
        sync: false

      - key: EMBEDDING_TYPE
        value: google

      - key: SKIP_BUILD_EMBED
        value: "true"

      - key: CHROMA_DOWNLOAD_URL
        sync: false
