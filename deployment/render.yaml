services:
  # Zentra FastAPI Backend Service
  - type: web
    name: zentra-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python app/rag/embed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zentra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zentra-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "600"
      - key: EMBEDDING_TYPE
        value: google
      - key: CHROMA_PATH
        value: chroma_db
      - key: CHROMA_COLLECTION
        value: health_knowledge

  # Redis instance for memory caching and task queueing
  - type: redis
    name: zentra-redis
    ipAllowList: [] # internal access only

databases:
  # Production PostgreSQL instance
  - name: zentra-db
    databaseName: healthgpt
    user: postgres
    plan: free
